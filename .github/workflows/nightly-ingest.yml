name: nightly-ingest
# SCHEDULE DISABLED 2026-08-25. This lane needs REDDIT_CLIENT_ID /
# REDDIT_CLIENT_SECRET (and optionally YOUTUBE_API_KEY) which have never been
# created, so it failed at step one every single morning — 08-21 through 08-25,
# zero rows ever written. A red X arriving daily for a cause that cannot fix
# itself just teaches you to ignore red Xs, which is worse than no alert.
#
# TO RE-ENABLE: create the two Reddit secrets (about 10 minutes, see
# REDDIT-KEY-GUIDE.md), add them with `gh secret set`, then uncomment the cron.
on:
  # schedule:
  #   - cron: "0 8 * * *" # 3am Central
  workflow_dispatch: {}

jobs:
  reddit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ingest Reddit
        working-directory: ingest
        run: python reddit_ingest.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: Ingest YouTube (skips if no key)
        working-directory: ingest
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY not set — skipping YouTube leg"
          else
            python youtube_ingest.py
          fi
      - name: Score + draft
        working-directory: ingest
        run: python enrich.py
      - name: Push to Supabase
        working-directory: ingest
        run: python db.py --source reddit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # TikTok leg intentionally NOT here: GitHub runner IPs are datacenter IPs
      # and get blocked almost immediately. Run tiktok_ingest.py from a home
      # machine on a schedule, then enrich.py + db.py --source tiktok the same way.
