name: sonar-daily
# Sonar's 24/7 lane. Runs with Jack's PC off.
# Verified 2026-08-25: a hosted runner reaches the search index (3/3), fetches
# prospect sites (3/3) and writes to Supabase (200). See probe-runner.yml.
on:
  schedule:
    - cron: "0 8 * * *"    # 3am Central, discovery slice + audit
    - cron: "0 20 * * *"   # 3pm Central, audit-only catch-up
    - cron: "0 2 * * *"    # 9pm Central — closes the 5pm-3am discovery dead zone
  workflow_dispatch:
    inputs:
      pairs:
        description: "city+niche pairs to sweep this run"
        default: "4"
      audit_only:
        description: "skip discovery, just clear the audit backlog"
        type: boolean
        default: false

concurrency:
  group: sonar-daily          # never let two runs fight over the same backlog
  cancel-in-progress: false

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ddgs requests

      - name: Run Sonar
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # The 3pm schedule and the audit_only input both mean "no discovery".
          # Only the 3pm slot is audit-only. 3am and 9pm both discover, so the
          # evening is no longer a ten-hour hole.
          if [ "${{ github.event.inputs.audit_only }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            ARGS="--audit-only"
          else
            ARGS="--pairs ${{ github.event.inputs.pairs || 4 }}"
          fi

          # RETRY ON TRANSIENT FAILURE, 2026-08-31.
          #
          # cloud_run exits 2 when discovery gets nothing back, which is a
          # deliberate guard: a slice that silently finds nothing must not
          # report success. That guard stays. The problem was that a ONE-OFF
          # network blip triggered it and mailed "All jobs have failed" even
          # though the audit step went on to finish 60 of 60. Observed:
          #   h2 connection driver error: peer closed connection without
          #   sending TLS close_notify
          #
          # A transient blip passes on the second attempt. A real block fails
          # both, and then the run fails as it should. This lowers the false
          # alarm rate without weakening what the exit code means.
          # Capture the exit code from the command itself. Do NOT read $? after
          # an `if cmd; then ... fi` -- once the if completes with its branch
          # untaken, $? is the status of the IF, which is 0. That mistake made a
          # real failure exit 0 and report green on 2026-08-31, which is exactly
          # the silent-success bug the exit-2 guard exists to prevent.
          rc=1
          for attempt in 1 2; do
            echo "--- sonar attempt $attempt ---"
            set +e
            python cloud_run.py $ARGS
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" = "1" ]; then
              echo "attempt 1 failed (exit $rc). Waiting 120s before one retry."
              sleep 120
            fi
          done
          echo "Both attempts failed (exit $rc). This is not a blip: the index"
          echo "refused this runner twice, 2 minutes apart. Treat as a real block."
          exit "$rc"

      - name: Report queue depth
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.request
          u, k = os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_KEY"]
          def count(q):
              req = urllib.request.Request(f"{u}/rest/v1/candidates?{q}&select=id",
                  headers={"apikey": k, "Authorization": f"Bearer {k}",
                           "Prefer": "count=exact", "Range": "0-0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.headers.get("content-range", "?/?").split("/")[-1]
          print(f"total prospects : {count('id=gt.0')}")
          print(f"awaiting review : {count('status=eq.new')}")
          print(f"high need (0.7+): {count('need_score=gte.0.7')}")
          print(f"unaudited       : {count('audited_at=is.null')}")
          PY
