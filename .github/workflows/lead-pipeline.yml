# Lead pipeline, PC-off. Collect -> load -> categorize -> draft, ending at
# drafts in the OS inbox. Never sends anything.
#
# Runs alongside the local WingLeadPipeline scheduled task. Both lanes are
# idempotent by design (load upserts on url+client, drafts dedupe on
# evidence_url, categorize skips judged rows), so overlap is safe and the
# cloud lane simply covers the hours the laptop is off or hibernating,
# which was measured killing local runs midday on 2026-08-27.
#
# Secrets required (repo settings): SONAR_SUPABASE_URL,
# SONAR_SUPABASE_SERVICE_KEY, GROQ_API_KEY. Optional when Jack creates them:
# REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET -- until then the reddit stage
# reports SKIPPED with its reason, which is correct, not a failure.
name: lead-pipeline

on:
  schedule:
    # UTC. Central time is UTC-5 in August: 6:40am, 12:40pm, 5:40pm CT.
    - cron: "40 11 * * *"
    - cron: "40 17 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: lead-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests ddgs

      - name: Write env file the pipeline reads
        # run_pipeline and load_raw look for wing-digital-os/.env.local next to
        # this repo. Recreate that layout instead of patching the code, so the
        # local and cloud lanes run identical code paths.
        run: |
          mkdir -p ../wing-digital-os
          {
            echo "SONAR_SUPABASE_URL=${{ secrets.SONAR_SUPABASE_URL }}"
            echo "SONAR_SUPABASE_SERVICE_KEY=${{ secrets.SONAR_SUPABASE_SERVICE_KEY }}"
          } > ../wing-digital-os/.env.local

      - name: Run pipeline
        working-directory: ingest
        env:
          LLM_ROUTER_DIR: ${{ github.workspace }}/ingest
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python run_pipeline.py --confirm

      - name: Report tail
        if: always()
        run: echo "run finished; the report above is the product"
