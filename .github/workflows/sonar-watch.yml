name: sonar-watch
# Per-client social monitoring, always on, PC off.
#
# Separate from sonar-daily (which discovers new prospect BUSINESSES). This
# watches for PEOPLE publicly asking for what each client sells, and files a
# drafted reply in the CRM under that client.
#
# Paced deliberately: the search index rate-limits on burst volume — several
# hundred rapid queries and it refuses across every backend — so this runs
# little and often rather than hammering once.
on:
  schedule:
    - cron: "0 13 * * *"   # 8am Central
    - cron: "0 17 * * *"   # 12pm Central
    - cron: "0 22 * * *"   # 5pm Central
  workflow_dispatch:
    inputs:
      client:
        description: "one client name, or blank for all"
        default: ""
      phrases:
        description: "intent phrases per city per platform"
        default: "2"

concurrency:
  group: sonar-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # youtube-transcript-api and yt-dlp are what the intel leg fetches
      # transcripts with. They were never installed here, so both backends
      # ImportError'd silently and every video resolved to "failed via none"
      # in 3.8 seconds — too fast to have been a network problem.
      - run: pip install ddgs requests youtube-transcript-api yt-dlp

      - name: Watch social for every active client
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          CLIENT="${{ github.event.inputs.client }}"
          PHRASES="${{ github.event.inputs.phrases || 2 }}"
          if [ -n "$CLIENT" ]; then
            python watch_social.py --client "$CLIENT" --phrases "$PHRASES" --limit 25
          else
            python watch_social.py --all --phrases "$PHRASES" --limit 40
          fi

      # Creator/competitor intel. Free YouTube RSS, no local resources, so it
      # rides along here. Non-fatal on purpose: an intel hiccup must never mark
      # the client watcher as failed.
      - name: Watch AI creators for new videos
        if: always()
        continue-on-error: true
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python intel_watch.py --limit 15 || echo "intel_watch failed — not fatal"

      # Pull captions for anything new. A video with no captions yields no
      # proposal, which is the correct outcome — never a guessed one.
      - name: Fetch transcripts for new videos
        if: always()
        continue-on-error: true
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -f intel_transcript.py ]; then
            python intel_transcript.py --backfill 8 || echo "transcript step failed — not fatal"
          else
            echo "intel_transcript.py not present yet — skipping"
          fi

      # Turn transcripts into concrete proposals for Jack to approve. Writes
      # rows with status 'proposed' ONLY. Nothing is ever applied here.
      - name: Propose system improvements from what the videos said
        if: always()
        continue-on-error: true
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f intel_propose.py ]; then
            python intel_propose.py --limit 5 || echo "propose step failed — not fatal"
          else
            echo "intel_propose.py not present yet — skipping"
          fi

      - name: CRM queue depth
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          u, k = os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_KEY"]
          req = urllib.request.Request(
              f"{u}/rest/v1/outbound?select=client,status&limit=5000",
              headers={"apikey": k, "Authorization": f"Bearer {k}"})
          rows = json.load(urllib.request.urlopen(req, timeout=30))
          by = {}
          for r in rows:
              d = by.setdefault(r["client"], {})
              d[r["status"]] = d.get(r["status"], 0) + 1
          for c, d in sorted(by.items()):
              print(f"{c}: " + ", ".join(f"{k2}={v}" for k2, v in sorted(d.items())))
          PY
